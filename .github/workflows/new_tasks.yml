name: Tasks Modified

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
# comment/edit out the above to stop/change the triggers
jobs:
  changed_files:
    runs-on: ubuntu-latest  # windows-latest || macos-latest
    timeout-minutes: 120
    name: Scan for changed tasks
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # OR "2" -> To retrieve the preceding commit.

      # Uses the dorny/paths-filter@v3 action to check for changes.
      # Outputs provided here: https://github.com/dorny/paths-filter#outputs
      - name: Check task folders
        id: changed-tasks
        uses: dorny/paths-filter@v3
        with:
          # tasks checks the tasks folder and api checks the api folder for changes
          filters: |
            tasks:
              - lm_eval/tasks/**
            api:
              - lm_eval/api/**
          list-files: json

      - name: Write changed file lists
        env:
          TASK_FILES: ${{ steps.changed-tasks.outputs.tasks_files }}
          API_FILES: ${{ steps.changed-tasks.outputs.api_files }}
        run: |
          mkdir -p .github/outputs
          printf '%s\n' "$TASK_FILES" | jq -r '.[]' > .github/outputs/tasks_all_changed_and_modified_files.txt
          printf '%s\n' "$API_FILES" | jq -r '.[]' > .github/outputs/api_all_changed_and_modified_files.txt

      # The next step is optional; it's just for debugging.
      - name: Run Tests
        if: steps.changed-tasks.outputs.tasks == 'true' || steps.changed-tasks.outputs.api == 'true'
        env:
          TASK_FILES: ${{ steps.changed-tasks.outputs.tasks_files }}
        run: |
          echo "One or more test file(s) has changed."
          echo "List of all the files that have changed: $TASK_FILES"

      - name: Set up Python 3.9
        if: steps.changed-tasks.outputs.tasks == 'true' || steps.changed-tasks.outputs.api == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
          cache: 'pip'
          cache-dependency-path: setup.py
      - name: Install dependencies
        if: steps.changed-tasks.outputs.tasks == 'true' || steps.changed-tasks.outputs.api == 'true'
        run: |
            python -m pip install --upgrade pip
            pip install -e '.[dev,ifeval]' --extra-index-url https://download.pytorch.org/whl/cpu
    #   Install optional git dependencies
    #       pip install bleurt@https://github.com/google-research/bleurt/archive/b610120347ef22b494b6d69b4316e303f5932516.zip#egg=bleurt
    #       if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Test with pytest
        # if new tasks are added, run tests on them
        if: steps.changed-tasks.outputs.tasks == 'true'
        run: python -m pytest tests/test_tasks.py -s -vv
        # if api is modified, run tests on it
      - name: Test more tasks with pytest
        env:
          API: true
        if: steps.changed-tasks.outputs.api == 'true'
        run: python -m pytest tests/test_tasks.py -s -vv